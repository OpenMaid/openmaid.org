# The site's server in its image (site plan §15): dist/ over plain HTTP on port 8080, behind the reverse proxy that
# terminates HTTPS on the server. nginx includes this file in its http block (conf.d/default.conf of
# nginx-unprivileged, which runs as a user and so cannot bind port 80).

# An entity's address without its slug, or with a wrong one, answers with a redirect to its page (finding 17, site plan
# §10.3). The request's path up to the entity's id, /<game>/<kind>/<id>, keys the map the build writes from its
# tooltip files (scripts/entity-redirects.mjs), some 10,000 lines, hence the larger hash.
map_hash_max_size 65536;
map_hash_bucket_size 128;

map $uri $entity_key {
	default "";
	"~^(?<entity>/[^/]+/[^/]+/[0-9]+)(?:/[^/]*)?/?$" $entity;
}

map $entity_key $entity_url {
	default "";
	include /etc/nginx/entity-redirects.map;
}

# How long a browser or a proxy keeps a file. Astro's assets and Pagefind's index files are named by their content, so
# they never change under one name. A picture keeps its name across exports of one game revision, so it is kept a day.
# A page is checked each time (nginx answers an unchanged one with 304, by its ETag).
map $uri $cache_control {
	default "no-cache";
	"~^/_astro/" "public, max-age=31536000, immutable";
	"~^/pagefind/.+\.pf_(fragment|index|meta|filter)$" "public, max-age=31536000, immutable";
	"~^/pictures/" "public, max-age=86400";
}

server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;
	server_tokens off;

	# The proxy in front knows the public host and scheme, so nginx's own redirects name only the path.
	absolute_redirect off;

	gzip on;
	gzip_vary on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

	# Set here only: a location with an add_header of its own would drop these.
	add_header Cache-Control $cache_control always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	error_page 404 /404.html;

	location / {
		# A page's address ends in a slash; one without it (no dot in it, so not a file) is redirected to it.
		rewrite ^([^.]*[^/])$ $1/ permanent;
		try_files $uri $uri/index.html @missing;
	}

	location @missing {
		if ($entity_url) {
			return 301 $entity_url;
		}
		return 404;
	}
}
